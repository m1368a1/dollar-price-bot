<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>robot bazar - live dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0a0e17;color:#e0e0e0;direction:rtl;min-width:320px}
.header{background:linear-gradient(135deg,#1a1f35,#0d1117);padding:16px 12px;text-align:center;border-bottom:2px solid #30363d;position:sticky;top:0;z-index:10}
.header h1{font-size:20px;color:#58a6ff}
.header .subtitle{font-size:12px;color:#8b949e;margin-top:2px}
.header .status{margin-top:6px;font-size:11px;color:#3fb950}
.container{max-width:900px;margin:0 auto;padding:10px}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:14px;margin-bottom:10px}
.card-title{font-size:15px;font-weight:bold;margin-bottom:10px}
.price-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #21262d;font-size:13px}
.price-row:last-child{border-bottom:none}
.price-label{color:#8b949e}
.price-value{font-weight:bold}
.up{color:#3fb950}.down{color:#f85149}.neutral{color:#d29922}
.big{font-size:26px;font-weight:bold;text-align:center;margin:8px 0}
.gauge{width:100%;height:22px;background:#21262d;border-radius:11px;overflow:hidden;margin:8px 0}
.gauge-fill{height:100%;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;color:#fff}
.gauge-text{text-align:center;font-size:12px;color:#8b949e}
.signal-box{text-align:center;padding:14px;border-radius:10px;margin:6px 0;font-size:16px;font-weight:bold}
.signal-buy{background:rgba(63,185,80,0.15);border:1px solid #3fb950;color:#3fb950}
.signal-sell{background:rgba(248,81,73,0.15);border:1px solid #f85149;color:#f85149}
.signal-wait{background:rgba(210,153,34,0.15);border:1px solid #d29922;color:#d29922}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px;text-align:right;border-bottom:1px solid #21262d}
th{color:#8b949e;font-weight:normal}
.footer{text-align:center;padding:12px;color:#484f58;font-size:11px}
.loading{text-align:center;padding:15px;color:#8b949e}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid #30363d;border-top:2px solid #58a6ff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.stale{opacity:0.5;border-color:#d29922}
</style>
</head>
<body>
<div class="header">
  <h1>&#x1F916; &#x0631;&#x0628;&#x0627;&#x062A; &#x0628;&#x0627;&#x0632;&#x0627;&#x0631;</h1>
  <div class="subtitle">&#x062F;&#x0627;&#x0634;&#x0628;&#x0648;&#x0631;&#x062F; &#x0632;&#x0646;&#x062F;&#x0647; &#x0627;&#x0637;&#x0644;&#x0627;&#x0639;&#x0627;&#x062A; &#x0628;&#x0627;&#x0632;&#x0627;&#x0631; &#x0627;&#x0631;&#x0632; &#x0648; &#x0631;&#x0645;&#x0632;&#x0627;&#x0631;&#x0632;</div>
  <div class="status" id="ts">&#x23F3; &#x062F;&#x0631; &#x062D;&#x0627;&#x0644; &#x0628;&#x0627;&#x0631;&#x06AF;&#x0630;&#x0627;&#x0631;&#x06CC;...</div>
</div>
<div class="container">
  <div class="card" id="c1"><div class="loading"><div class="spinner"></div> &#x0642;&#x06CC;&#x0645;&#x062A;&#x200C;&#x0647;&#x0627;</div></div>
  <div class="card" id="c3"><div class="loading"><div class="spinner"></div> &#x0628;&#x06CC;&#x062A;&#x06A9;&#x0648;&#x06CC;&#x0646;</div></div>
  <div class="card" id="c4"><div class="loading"><div class="spinner"></div> &#x062A;&#x0631;&#x0633; &#x0648; &#x0637;&#x0645;&#x0639;</div></div>
  <div class="card" id="c5"><div class="loading"><div class="spinner"></div> &#x0628;&#x0627;&#x0632;&#x0627;&#x0631; &#x062C;&#x0647;&#x0627;&#x0646;&#x06CC;</div></div>
  <div class="card" id="c6"><div class="loading"><div class="spinner"></div> &#x0633;&#x06CC;&#x06AF;&#x0646;&#x0627;&#x0644;</div></div>
  <div class="card" id="c7"><div class="loading"><div class="spinner"></div> &#x0631;&#x0645;&#x0632;&#x0627;&#x0631;&#x0632;&#x0647;&#x0627;</div></div>
</div>
<div class="footer"><span style="font-size:22px;font-weight:bold;color:#58a6ff">&#x1F916; RoboMohsenBot</span><br>&#x062F;&#x0627;&#x0634;&#x0628;&#x0648;&#x0631;&#x062F; &#x0632;&#x0646;&#x062F;&#x0647; | &#x0628;&#x0631;&#x0648;&#x0632;&#x0631;&#x0633;&#x0627;&#x0646;&#x06CC; &#x062E;&#x0648;&#x062F;&#x06A9;&#x0627;&#x0631; &#x0647;&#x0631; 30 &#x062B;&#x0627;&#x0646;&#x06CC;&#x0647;</div>
<script>
function F(n){return n?Number(n).toLocaleString('en-US',{maximumFractionDigits:0}):'\u2014'}
function F2(n){return n?Number(n).toLocaleString('en-US',{maximumFractionDigits:2}):'\u2014'}
function U(n){return '$'+F2(n)}
function P(n){if(!n)return'0';return n.toLocaleString('en-US')}

async function load(){
  var d=null;
  try{
    var r=await fetch('prices.json?t='+Date.now());
    if(r.ok) d=await r.json();
  }catch(e){}

  if(!d){
    document.getElementById('ts').textContent='\u274C \u062F\u0627\u062F\u0647 \u0647\u0646\u0648\u0632 \u0628\u0627\u0631\u06AF\u0630\u0627\u0631\u06CC \u0646\u0634\u062F\u0647 \u0627\u0633\u062A';
    return;
  }

  // Card 1: Iran Prices
  var c1='<div class="card-title">\uD83D\uDCB0 \u0642\u06CC\u0645\u062A \u0644\u062D\u0638\u0647\u0627\u06CC \u0628\u0627\u0632\u0627\u0631 \u0622\u0632\u0627\u062F</div>';
  if(d.usd_sell){
    c1+='<div class="price-row"><span class="price-label">\uD83D\uDCB5 \u062F\u0644\u0627\u0631 \u0641\u0631\u0648\u0634</span><span class="price-value neutral">'+P(d.usd_sell)+' \u062A\u0648\u0645\u0627\u0646</span></div>';
    c1+='<div class="price-row"><span class="price-label">\uD83D\uDCB5 \u062F\u0644\u0627\u0631 \u062E\u0631\u06CC\u062F</span><span class="price-value neutral">'+P(d.usd_buy)+' \u062A\u0648\u0645\u0627\u0646</span></div>';
    if(d.btc_usd && d.usd_sell) c1+='<div class="price-row"><span class="price-label">\u20BF \u0628\u06CC\u062A\u06A9\u0648\u06CC\u0646 \u0628\u0647 \u062A\u0648\u0645\u0627\u0646</span><span class="price-value">'+P(Math.round(d.btc_usd*d.usd_sell))+' \u062A\u0648\u0645\u0627\u0646</span></div>';
  }else{c1+='<div style="color:#f85149;text-align:center">\u062E\u0637\u0627</div>';}
  document.getElementById('c1').innerHTML=c1;

  // Card 3: BTC
  var c3='<div class="card-title">\u20BF \u0628\u06CC\u062A\u06A9\u0648\u06CC\u0646</div>';
  if(d.btc_usd){
    c3+='<div class="big" style="color:#f7931a">'+U(d.btc_usd)+'</div>';
    c3+='<div class="price-row"><span class="price-label">\u0628\u0647 \u062A\u0648\u0645\u0627\u0646</span><span class="price-value">'+P(Math.round(d.btc_usd*(d.usd_sell||1)))+' \u062A\u0648\u0645\u0627\u0646</span></div>';
  }else{c3+='<div style="color:#f85149;text-align:center">\u062E\u0637\u0627</div>';}
  document.getElementById('c3').innerHTML=c3;

  // Card 4: Fear & Greed
  var c4='<div class="card-title">\uD83E\uDDE0 \u0634\u0627\u062E\u0635 \u062A\u0631\u0633 \u0648 \u0637\u0645\u0639</div>';
  if(d.fear_greed){
    var v=d.fear_greed;
    var clr=v>=75?'#3fb950':v>=55?'#58a6ff':v>=45?'#d29922':v>=25?'#f0883e':'#f85149';
    var lbl=v>=75?'\u0637\u0645\u0639 \u0634\u062F\u06CC\u062F':v>=55?'\u0637\u0645\u0639':v>=45?'\u062E\u0646\u062B\u06CC':v>=25?'\u062A\u0631\u0633':'\u062A\u0631\u0633 \u0634\u062F\u06CC\u062F';
    var em=v>=75?'\uD83E\uDD11':v>=55?'\uD83D\uDE0F':v>=45?'\uD83D\uDE10':v>=25?'\uD83D\uDE30':'\uD83D\uDE31';
    c4+='<div class="big" style="color:'+clr+'">'+em+' '+v+'/100</div>';
    c4+='<div class="gauge"><div class="gauge-fill" style="width:'+v+'%;background:'+clr+'">'+lbl+'</div></div>';
    c4+='<div class="gauge-text">\u0648\u0636\u0639\u06CC\u062A: <strong style="color:'+clr+'">'+lbl+'</strong></div>';
  }else{c4+='<div style="color:#f85149;text-align:center">\u062E\u0637\u0627</div>';}
  document.getElementById('c4').innerHTML=c4;

  // Card 5: Global
  var c5='<div class="card-title">\uD83C\uDF0D \u0628\u0627\u0632\u0627\u0631 \u062C\u0647\u0627\u0646\u06CC</div>';
  if(d.market_cap){
    var mc=d.market_cap;var vol=d.market_volume||0;var bd=d.btc_dominance||0;var ch=d.market_change||0;
    var cc=ch>=0?'up':'down';var sg=ch>=0?'+':'';
    c5+='<div class="price-row"><span class="price-label">\u0627\u0631\u0632\u0634 \u06A9\u0644 \u0628\u0627\u0632\u0627\u0631</span><span class="price-value">$'+F2(mc/1e12)+'T</span></div>';
    c5+='<div class="price-row"><span class="price-label">\u062A\u063A\u06CC\u06CC\u0631 24 \u0633\u0627\u0639\u062A\u0647</span><span class="price-value '+cc+'">'+sg+F2(ch)+'%</span></div>';
    c5+='<div class="price-row"><span class="price-label">\u062D\u062C\u0645 \u0645\u0639\u0627\u0645\u0644\u0627\u062A</span><span class="price-value">$'+F2(vol/1e9)+'B</span></div>';
    c5+='<div class="price-row"><span class="price-label">\u062A\u0633\u0644\u0637 \u0628\u06CC\u062A\u06A9\u0648\u06CC\u0646</span><span class="price-value">'+F2(bd)+'%</span></div>';
  }else{c5+='<div style="color:#f85149;text-align:center">\u062E\u0637\u0627</div>';}
  document.getElementById('c5').innerHTML=c5;

  // Card 6: Signal
  var c6='<div class="card-title">\uD83E\uDDED \u0633\u06CC\u06AF\u0646\u0627\u0644 \u062E\u0631\u06CC\u062F / \u0641\u0631\u0648\u0634</div>';
  if(d.fear_greed){
    var v2=d.fear_greed;var sig,cls;
    if(v2<25){sig='\uD83D\uDFE2 \u062E\u0631\u06CC\u062F \u0642\u0648\u06CC';cls='signal-buy';}
    else if(v2<40){sig='\uD83D\uDFE2 \u062E\u0631\u06CC\u062F';cls='signal-buy';}
    else if(v2<60){sig='\uD83D\uDFE1 \u0635\u0628\u0631';cls='signal-wait';}
    else if(v2<75){sig='\uD83D\uDFE0 \u0641\u0631\u0648\u0634';cls='signal-sell';}
    else{sig='\uD83D\uDFE0 \u0641\u0631\u0648\u0634 \u0642\u0648\u06CC';cls='signal-sell';}
    c6+='<div class="signal-box '+cls+'">'+sig+'<div style="font-size:13px;margin-top:4px">\u0627\u0645\u062A\u06CC\u0627\u0632: '+v2+'/100</div></div>';
    c6+='<div style="font-size:11px;color:#8b949e;text-align:center;margin-top:8px;line-height:1.8">\uD83E\uDDED \u0645\u0628\u0646\u0627 \u0633\u06CC\u06AF\u0646\u0627\u0644: \u062A\u0631\u0633 \u0648 \u0637\u0645\u0639\u060C \u0631\u0648\u0646\u062F 7 \u0631\u0648\u0632\u0647 \u0628\u06CC\u062A\u06A9\u0648\u06CC\u0646\u060C RSI \u0648 \u0641\u0639\u0627\u0644\u06CC\u062A \u0646\u0647\u0646\u06AF\u200C\u0647\u0627 (\u0628\u0627\u0632\u0627\u0631 \u0631\u0645\u0632\u0627\u0631\u0632)<br>\u26A0\uFE0F \u062A\u0648\u0635\u06CC\u0647 \u0645\u0627\u0644\u06CC \u0646\u06CC\u0633\u062A</div>';
  }else{c6+='<div style="color:#f85149;text-align:center">\u062E\u0637\u0627</div>';}
  document.getElementById('c6').innerHTML=c6;

  // Card 7: Top 10
  var c7='<div class="card-title">\uD83D\uDCCA 10 \u0631\u0645\u0632\u0627\u0631\u0632 \u0628\u0631\u062A\u0631</div>';
  if(d.top10&&d.top10.length){
    c7+='<table><thead><tr><th>#</th><th>\u0646\u0645\u0627\u062F</th><th>\u0642\u06CC\u0645\u062A</th><th>\u062A\u063A\u06CC\u06CC\u0631 24\u0633</th><th>\u0627\u0631\u0632\u0634 \u0628\u0627\u0632\u0627\u0631</th></tr></thead><tbody>';
    for(var i=0;i<d.top10.length;i++){
      var c=d.top10[i];var ch=c.change_24h||0;
      var cc=ch>=0?'up':'down';var sg=ch>=0?'+':'';
      c7+='<tr><td>'+(i+1)+'</td><td><strong>'+c.symbol.toUpperCase()+'</strong></td><td>'+U(c.price)+'</td><td class="'+cc+'">'+sg+F2(ch)+'%</td><td>$'+F((c.market_cap||0)/1e9)+'B</td></tr>';
    }
    c7+='</tbody></table>';
  }else{c7+='<div style="color:#f85149;text-align:center">\u062E\u0637\u0627</div>';}
  document.getElementById('c7').innerHTML=c7;

  // Timestamp
  var now=new Date();
  var th=now.toLocaleString('fa-IR',{timeZone:'Asia/Tehran'});
  var dataTime=d.timestamp||'unknown';
  document.getElementById('ts').textContent='\uD83D\uDFE2 \u0628\u0631\u0648\u0632\u0631\u0633\u0627\u0646\u06CC: '+th+' | \u062F\u0627\u062F\u0647: '+dataTime;
}

load();
setInterval(load,30000);
</script>
</body>
</html>
