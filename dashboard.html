<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b14">
<title>RoboMohsenBot — داشبورد زنده بازار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#070b14;--card:rgba(20,26,41,.82);--border:rgba(120,150,255,.14);
  --text:#e8ebf5;--muted:#8a93a8;--accent:#5b8cff;--green:#2ee6a8;--red:#ff5d6c;--amber:#ffb547;
}
html{scroll-behavior:smooth}
body{font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;color:var(--text);direction:rtl;min-width:320px;min-height:100vh;
  background:
    radial-gradient(1100px 550px at 88% -8%,rgba(91,140,255,.16),transparent 60%),
    radial-gradient(900px 500px at -8% 18%,rgba(46,230,168,.09),transparent 60%),
    radial-gradient(800px 500px at 50% 110%,rgba(255,93,108,.06),transparent 60%),
    linear-gradient(180deg,#070b14,#0a1020 55%,#070b14);
  background-attachment:fixed}
.header{background:rgba(9,13,26,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding:18px 14px 14px;text-align:center;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;
  box-shadow:0 6px 24px rgba(0,0,0,.35)}
.header h1{font-size:26px;font-weight:900;letter-spacing:.3px;
  background:linear-gradient(90deg,#5b8cff,#2ee6a8);-webkit-background-clip:text;background-clip:text;color:transparent}
.header .subtitle{font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:600}
.header .status{margin-top:9px;font-size:11.5px;color:var(--green);display:inline-flex;align-items:center;gap:6px;
  background:rgba(46,230,168,.08);border:1px solid rgba(46,230,168,.28);padding:4px 14px;border-radius:99px}
.container{max-width:980px;margin:0 auto;padding:16px 14px;display:grid;grid-template-columns:1fr;gap:13px}
@media(min-width:720px){.container{grid-template-columns:1fr 1fr}#c1,#c6,#c7,#c8,#c9,#ca{grid-column:1/-1}}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 10px 28px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.04);
  position:relative;overflow:hidden;animation:fadeUp .55s ease both;
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-3px);border-color:rgba(91,140,255,.4);box-shadow:0 14px 34px rgba(0,0,0,.45),0 0 0 1px rgba(91,140,255,.08)}
.card::before{content:'';position:absolute;inset:0 0 auto 0;height:2px;
  background:linear-gradient(90deg,transparent 5%,rgba(91,140,255,.65) 50%,transparent 95%);opacity:.85}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-title{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.price-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;
  border-bottom:1px dashed rgba(255,255,255,.07);font-size:13.5px}
.price-row:last-child{border-bottom:none}
.price-label{color:var(--muted)}
.price-value{font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--green)}.down{color:var(--red)}.neutral{color:var(--amber)}
.big{font-size:30px;font-weight:800;text-align:center;margin:10px 0;letter-spacing:.4px;font-variant-numeric:tabular-nums}
.gauge{width:100%;height:24px;background:rgba(255,255,255,.06);border-radius:12px;overflow:hidden;margin:10px 0;
  box-shadow:inset 0 1px 4px rgba(0,0,0,.45)}
.gauge-fill{height:100%;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;transition:width .9s ease}
.gauge-text{text-align:center;font-size:12px;color:var(--muted)}
.signal-box{text-align:center;padding:18px;border-radius:14px;margin:8px 0;font-size:17px;font-weight:800}
.signal-buy{background:linear-gradient(135deg,rgba(46,230,168,.18),rgba(46,230,168,.05));border:1px solid rgba(46,230,168,.5);color:var(--green);box-shadow:0 0 26px rgba(46,230,168,.16)}
.signal-sell{background:linear-gradient(135deg,rgba(255,93,108,.18),rgba(255,93,108,.05));border:1px solid rgba(255,93,108,.5);color:var(--red);box-shadow:0 0 26px rgba(255,93,108,.16)}
.signal-wait{background:linear-gradient(135deg,rgba(255,181,71,.18),rgba(255,181,71,.05));border:1px solid rgba(255,181,71,.5);color:var(--amber);box-shadow:0 0 26px rgba(255,181,71,.16)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid rgba(255,255,255,.05)}
th{color:var(--muted);font-weight:600;font-size:11.5px}
tbody tr{transition:background .15s ease}
tbody tr:hover{background:rgba(91,140,255,.07)}
tbody tr:last-child td{border-bottom:none}
.footer{text-align:center;padding:18px 12px 28px;color:var(--muted);font-size:11.5px}
.loading{text-align:center;padding:18px;color:var(--muted)}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-inline-end:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.stale{opacity:.55;border-color:var(--amber)}
</style>
</head>
<body>
<div class="header">
  <h1>🤖 RoboMohsenBot</h1>
  <div class="subtitle" style="font-weight:bold">ربات بازار — داشبورد زنده اطلاعات بازار ارز و رمزارز</div>
  <div class="status" id="ts">⏳ در حال بارگذاری...</div>
</div>
<div class="container">
  <div class="card" id="c1"><div class="loading"><span class="spinner"></span> 💵 قیمت‌ها</div></div>
  <div class="card" id="c6"><div class="loading"><span class="spinner"></span> 🧭 سیگنال خرید / فروش</div></div>
  <div class="card" id="c3"><div class="loading"><span class="spinner"></span> ₿ بیتکوین</div></div>
  <div class="card" id="c4"><div class="loading"><span class="spinner"></span> 🧠 ترس و طمع</div></div>
  <div class="card" id="c5"><div class="loading"><span class="spinner"></span> 🌍 بازار جهانی</div></div>
  <div class="card" id="cw"><div class="loading"><span class="spinner"></span> 🐋 تحلیل نهنگ‌ها</div></div>
  <div class="card" id="c7"><div class="loading"><span class="spinner"></span> 📊 10 رمزارز برتر</div></div>
  <div class="card" id="c8"><div class="loading"><span class="spinner"></span> 📰 اخبار اینوستینگ</div></div>
  <div class="card" id="c9"><div class="loading"><span class="spinner"></span> 📰 اخبار بلومبرگ</div></div>
  <div class="card" id="ca"><div class="loading"><span class="spinner"></span> 📊 تحلیل روزانه</div></div>
</div>
<div class="footer"><span style="font-size:22px;font-weight:800;color:#5b8cff">🤖 RoboMohsenBot</span><br>داشبورد زنده | بروزرسانی خودکار هر 30 ثانیه</div>
<script>
function F(n){return n?Number(n).toLocaleString('en-US',{maximumFractionDigits:0}):'\u2014'}
function F2(n){return n?Number(n).toLocaleString('en-US',{maximumFractionDigits:2}):'\u2014'}
function U(n){return '$'+F2(n)}
function P(n){if(!n)return'0';return n.toLocaleString('en-US')}

async function load(){
  var d=null;
  try{
    var r=await fetch('prices.json?t='+Date.now());
    if(r.ok) d=await r.json();
  }catch(e){}

  if(!d){
    document.getElementById('ts').textContent='\u274C \u062F\u0627\u062F\u0647 \u0647\u0646\u0648\u0632 \u0628\u0627\u0631\u06AF\u0630\u0627\u0631\u06CC \u0646\u0634\u062F\u0647 \u0627\u0633\u062A';
    return;
  }

  // Card 1: Iran Prices
  var c1='<div class="card-title">\uD83D\uDCB0 \u0642\u06CC\u0645\u062A \u0644\u062D\u0638\u0647\u0627\u06CC \u0628\u0627\u0632\u0627\u0631 \u0622\u0632\u0627\u062F</div>';
  if(d.usd_sell){
    c1+='<div class="price-row"><span class="price-label">\uD83D\uDCB5 \u062F\u0644\u0627\u0631 \u0641\u0631\u0648\u0634</span><span class="price-value neutral">'+P(d.usd_sell)+' \u062A\u0648\u0645\u0627\u0646</span></div>';
    c1+='<div class="price-row"><span class="price-label">\uD83D\uDCB5 \u062F\u0644\u0627\u0631 \u062E\u0631\u06CC\u062F</span><span class="price-value neutral">'+P(d.usd_buy)+' \u062A\u0648\u0645\u0627\u0646</span></div>';
    if(d.btc_usd && d.usd_sell) c1+='<div class="price-row"><span class="price-label">\u20BF \u0628\u06CC\u062A\u06A9\u0648\u06CC\u0646 \u0628\u0647 \u062A\u0648\u0645\u0627\u0646</span><span class="price-value">'+P(Math.round(d.btc_usd*d.usd_sell))+' \u062A\u0648\u0645\u0627\u0646</span></div>';
  }else{c1+='<div style="color:#f85149;text-align:center">\u062E\u0637\u0627</div>';}
  document.getElementById('c1').innerHTML=c1;

  // Card 6: Signal
  var c6='<div class="card-title">\uD83E\uDDED \u0633\u06CC\u06AF\u0646\u0627\u0644 \u062E\u0631\u06CC\u062F / \u0641\u0631\u0648\u0634</div>';
  if(d.fear_greed){
    var v2=d.fear_greed;var sig,cls;
    if(v2<25){sig='\uD83D\uDFE2 \u062E\u0631\u06CC\u062F \u0642\u0648\u06CC';cls='signal-buy';}
    else if(v2<40){sig='\uD83D\uDFE2 \u062E\u0631\u06CC\u062F';cls='signal-buy';}
    else if(v2<60){sig='\uD83D\uDFE1 \u0635\u0628\u0631';cls='signal-wait';}
    else if(v2<75){sig='\uD83D\uDFE0 \u0641\u0631\u0648\u0634';cls='signal-sell';}
    else{sig='\uD83D\uDFE0 \u0641\u0631\u0648\u0634 \u0642\u0648\u06CC';cls='signal-sell';}
    c6+='<div class="signal-box '+cls+'">'+sig+'<div style="font-size:13px;margin-top:4px">\u0627\u0645\u062A\u06CC\u0627\u0632: '+v2+'/100</div></div>';
    c6+='<div style="font-size:11px;color:#8b949e;text-align:center;margin-top:8px;line-height:1.8">\uD83E\uDDED \u0645\u0628\u0646\u0627\u06CC \u0633\u06CC\u06AF\u0646\u0627\u0644: \u062A\u0631\u0633 \u0648 \u0637\u0645\u0639\u060C \u0631\u0648\u0646\u062F 7 \u0631\u0648\u0632\u0647\u060C RSI\u060C \u0641\u0639\u0627\u0644\u06CC\u062A \u0646\u0647\u0646\u06AF\u200C\u0647\u0627 \u0648 \u0627\u0644\u06AF\u0648\u06CC \u06A9\u0646\u062F\u0644\u0627\u0633\u062A\u06CC\u06A9 (\u0628\u0627\u0632\u0627\u0631 \u0631\u0645\u0632\u0627\u0631\u0632)<br>\u26A0\uFE0F \u062A\u0648\u0635\u06CC\u0647 \u0645\u0627\u0644\u06CC \u0646\u06CC\u0633\u062A</div>';
  }else{c6+='<div style="color:#f85149;text-align:center">\u062E\u0637\u0627</div>';}
  document.getElementById('c6').innerHTML=c6;

  // Card 3: BTC
  var c3='<div class="card-title">\u20BF \u0628\u06CC\u062A\u06A9\u0648\u06CC\u0646</div>';
  if(d.btc_usd){
    c3+='<div class="big" style="color:#f7931a">'+U(d.btc_usd)+'</div>';
    c3+='<div class="price-row"><span class="price-label">\u0628\u0647 \u062A\u0648\u0645\u0627\u0646</span><span class="price-value">'+P(Math.round(d.btc_usd*(d.usd_sell||1)))+' \u062A\u0648\u0645\u0627\u0646</span></div>';
  }else{c3+='<div style="color:#f85149;text-align:center">\u062E\u0637\u0627</div>';}
  document.getElementById('c3').innerHTML=c3;

  // Card 4: Fear & Greed
  var c4='<div class="card-title">\uD83E\uDDE0 \u0634\u0627\u062E\u0635 \u062A\u0631\u0633 \u0648 \u0637\u0645\u0639</div>';
  if(d.fear_greed){
    var v=d.fear_greed;
    var clr=v>=75?'#3fb950':v>=55?'#58a6ff':v>=45?'#d29922':v>=25?'#f0883e':'#f85149';
    var lbl=v>=75?'\u0637\u0645\u0639 \u0634\u062F\u06CC\u062F':v>=55?'\u0637\u0645\u0639':v>=45?'\u062E\u0646\u062B\u06CC':v>=25?'\u062A\u0631\u0633':'\u062A\u0631\u0633 \u0634\u062F\u06CC\u062F';
    var em=v>=75?'\uD83E\uDD11':v>=55?'\uD83D\uDE0F':v>=45?'\uD83D\uDE10':v>=25?'\uD83D\uDE30':'\uD83D\uDE31';
    c4+='<div class="big" style="color:'+clr+'">'+em+' '+v+'/100</div>';
    c4+='<div class="gauge"><div class="gauge-fill" style="width:'+v+'%;background:'+clr+'">'+lbl+'</div></div>';
    c4+='<div class="gauge-text">\u0648\u0636\u0639\u06CC\u062A: <strong style="color:'+clr+'">'+lbl+'</strong></div>';
  }else{c4+='<div style="color:#f85149;text-align:center">\u062E\u0637\u0627</div>';}
  document.getElementById('c4').innerHTML=c4;

  // Card 5: Global
  var c5='<div class="card-title">\uD83C\uDF0D \u0628\u0627\u0632\u0627\u0631 \u062C\u0647\u0627\u0646\u06CC</div>';
  if(d.market_cap){
    var mc=d.market_cap;var vol=d.market_volume||0;var bd=d.btc_dominance||0;var ch=d.market_change||0;
    var cc=ch>=0?'up':'down';var sg=ch>=0?'+':'';
    c5+='<div class="price-row"><span class="price-label">\u0627\u0631\u0632\u0634 \u06A9\u0644 \u0628\u0627\u0632\u0627\u0631</span><span class="price-value">$'+F2(mc/1e12)+'T</span></div>';
    c5+='<div class="price-row"><span class="price-label">\u062A\u063A\u06CC\u06CC\u0631 24 \u0633\u0627\u0639\u062A\u0647</span><span class="price-value '+cc+'">'+sg+F2(ch)+'%</span></div>';
    c5+='<div class="price-row"><span class="price-label">\u062D\u062C\u0645 \u0645\u0639\u0627\u0645\u0644\u0627\u062A</span><span class="price-value">$'+F2(vol/1e9)+'B</span></div>';
    c5+='<div class="price-row"><span class="price-label">\u062A\u0633\u0644\u0637 \u0628\u06CC\u062A\u06A9\u0648\u06CC\u0646</span><span class="price-value">'+F2(bd)+'%</span></div>';
  }else{c5+='<div style="color:#f85149;text-align:center">\u062E\u0637\u0627</div>';}
  document.getElementById('c5').innerHTML=c5;

  // Card Whale: Whale Analysis
  var cw='<div class="card-title">\uD83D\uDC0B \u062a\u062D\u0644\u06CC\u0644 \u0646\u0647\u0646\u06AF\u200C\u0647\u0627</div>';
  if(d.whales&&d.whales.unconfirmed){
    var wu=d.whales.unconfirmed;
    cw+='<div class="price-row"><span class="price-label">\u0641\u0639\u0627\u0644\u06CC\u062A \u06a9\u0644\u06cc</span><span class="price-value">'+wu.level+' ('+wu.score+'/100)</span></div>';
    cw+='<div class="price-row"><span class="price-label">\u062A\u0631\u0627\u06A9\u0646\u0634 \u0628\u0632\u0631\u06af</span><span class="price-value">'+wu.count+'</span></div>';
    cw+='<div class="price-row"><span class="price-label">\u062d\u062C\u0645 \u06a9\u0644</span><span class="price-value">'+Math.round(wu.total_btc)+' BTC</span></div>';
    cw+='<div class="price-row"><span class="price-label">\u0628\u0633\u06CC\u0627\u0631 \u0628\u0632\u0631\u06af</span><span class="price-value">'+wu.mega_whales+' | \u0628\u0632\u0631\u06af: '+wu.large_whales+' | \u0645\u062A\u0648\u0633\u0637: '+wu.medium_whales+'</span></div>';
    if(wu.top&&wu.top.length){
      cw+='<div style="font-size:12px;color:#8b949e;margin-top:8px">\u0628\u0632\u0631\u06AF\u062A\u0631\u06CC\u0646 \u062A\u0631\u0627\u06A9\u0646\u0634\u200C\u0647\u0627:</div>';
      for(var i=0;i<wu.top.length;i++){var w=wu.top[i];
        var dir=w.direction==='exchange_out'?'\u0648\u0631\u0648\u062F \u0628\u0647 \u0635\u0631\u0627\u0641\u06CC':'\u062E\u0631\u0648\u062C \u0627\u0632 \u0635\u0631\u0627\u0641\u06CC';
        cw+='<div style="font-size:12px;padding:5px 0;border-bottom:1px solid #21262d">'+Math.round(w.btc)+' BTC | '+w.tier+' | '+dir+'</div>';
      }
    }
  }else{
    cw+='<div style="color:#8b949e;text-align:center;padding:10px">\u0627\u0637\u0644\u0627\u0639\u0627\u062A \u0645\u0648\u062C\u0648\u062F \u0646\u06cc\u0633\u062A</div>';
  }
  document.getElementById('cw').innerHTML=cw;

  // Card 7: Top 10
  var c7='<div class="card-title">\uD83D\uDCCA 10 \u0631\u0645\u0632\u0627\u0631\u0632 \u0628\u0631\u062A\u0631</div>';
  if(d.top10&&d.top10.length){
    c7+='<table><thead><tr><th>#</th><th>\u0646\u0645\u0627\u062F</th><th>\u0642\u06CC\u0645\u062A</th><th>\u062A\u063A\u06CC\u06CC\u0631 24\u0633</th><th>\u0627\u0631\u0632\u0634 \u0628\u0627\u0632\u0627\u0631</th></tr></thead><tbody>';
    for(var i=0;i<d.top10.length;i++){
      var c=d.top10[i];var ch=c.change_24h||0;
      var cc=ch>=0?'up':'down';var sg=ch>=0?'+':'';
      c7+='<tr><td>'+(i+1)+'</td><td><strong>'+c.symbol.toUpperCase()+'</strong></td><td>'+U(c.price)+'</td><td class="'+cc+'">'+sg+F2(ch)+'%</td><td>$'+F((c.market_cap||0)/1e9)+'B</td></tr>';
    }
    c7+='</tbody></table>';
  }else{c7+='<div style="color:#f85149;text-align:center">\u062E\u0637\u0627</div>';}
  document.getElementById('c7').innerHTML=c7;

  // Card 8: Investing.com News (separate)
  var c8='<div class="card-title">\uD83D\uDCF0 \u0627\u062e\u0628\u0627\u0631 \u0627\u06cc\u0646\u0648\u0633\u062a\u06cc\u0646\u06af</div>';
  if(d.news_investing&&d.news_investing.length){
    for(var i=0;i<d.news_investing.length;i++){
      var n=d.news_investing[i];
      c8+='<div style="font-size:13px;padding:8px 0;border-bottom:1px solid #21262d;line-height:1.6">';
      c8+='<div>'+n.title+'</div>';
      c8+='<div style="font-size:11px;color:#8b949e;margin-top:3px">Investing.com</div>';
      c8+='</div>';
    }
  }else if(d.news&&d.news.length){
    for(var i=0;i<d.news.length;i++){
      var n=d.news[i];
      if(n.source==='Investing.com'||n.source==='\u0627\u06cc\u0646\u0648\u0633\u062a\u06cc\u0646\u06af'){
        c8+='<div style="font-size:13px;padding:8px 0;border-bottom:1px solid #21262d;line-height:1.6"><div>'+n.title+'</div><div style="font-size:11px;color:#8b949e;margin-top:3px">Investing.com</div></div>';
      }
    }
  }
  if(c8==='<div class="card-title">\uD83D\uDCF0 \u0627\u062e\u0628\u0627\u0631 \u0627\u06cc\u0646\u0648\u0633\u062a\u06cc\u0646\u06af</div>'){
    c8+='<div style="color:#8b949e;text-align:center;padding:10px">\u062e\u0628\u0631\u06cc \u0645\u0648\u062C\u0648\u062F \u0646\u06cc\u0633\u062A</div>';
  }
  document.getElementById('c8').innerHTML=c8;

  // Card 9: Bloomberg News (separate)
  var c9='<div class="card-title">\uD83D\uDCF0 \u0627\u062e\u0628\u0627\u0631 \u0628\u0644\u0648\u0645\u0628\u0631\u06af</div>';
  if(d.news_bloomberg&&d.news_bloomberg.length){
    for(var i=0;i<d.news_bloomberg.length;i++){
      var n=d.news_bloomberg[i];
      c9+='<div style="font-size:13px;padding:8px 0;border-bottom:1px solid #21262d;line-height:1.6">';
      c9+='<div>'+n.title+'</div>';
      c9+='<div style="font-size:11px;color:#8b949e;margin-top:3px">Bloomberg</div>';
      c9+='</div>';
    }
  }else if(d.news&&d.news.length){
    for(var i=0;i<d.news.length;i++){
      var n=d.news[i];
      if(n.source==='Bloomberg'){
        c9+='<div style="font-size:13px;padding:8px 0;border-bottom:1px solid #21262d;line-height:1.6"><div>'+n.title+'</div><div style="font-size:11px;color:#8b949e;margin-top:3px">Bloomberg</div></div>';
      }
    }
  }
  if(c9==='<div class="card-title">\uD83D\uDCF0 \u0627\u062e\u0628\u0627\u0631 \u0628\u0644\u0648\u0645\u0628\u0631\u06af</div>'){
    c9+='<div style="color:#8b949e;text-align:center;padding:10px">\u062e\u0628\u0631\u06cc \u0645\u0648\u062C\u0648\u062F \u0646\u06cc\u0633\u062A</div>';
  }
  document.getElementById('c9').innerHTML=c9;

  // Card ca: Daily Analysis from analyses/manifest.json
  var ca='<div class="card-title">📊 تحلیل روزانه</div>';
  try{
    var analysisResponse=await fetch('analyses/manifest.json?t='+Date.now());
    var analyses=analysisResponse.ok?await analysisResponse.json():[];
    if(Array.isArray(analyses)&&analyses.length){
      analyses.sort(function(a,b){
        var ad=String(a.date||'')+' '+String(a.added||'');
        var bd=String(b.date||'')+' '+String(b.added||'');
        return ad.localeCompare(bd);
      });
      var latest=analyses[analyses.length-1];
      ca+='<div style="text-align:center">';
      ca+='<a href="'+latest.file+'" target="_blank" rel="noopener"><img src="'+latest.file+'?v='+encodeURIComponent(latest.date||'')+'" loading="lazy" alt="تحلیل روزانه" style="display:block;width:100%;max-height:460px;object-fit:contain;border-radius:12px;border:1px solid rgba(120,150,255,.2);cursor:zoom-in"></a>';
      if(latest.caption) ca+='<div style="font-size:12.5px;margin-top:8px;line-height:1.8">'+latest.caption+'</div>';
      if(latest.date) ca+='<div style="font-size:11px;color:#8b949e;margin-top:3px">📅 '+latest.date+'</div>';
      ca+='<div style="margin-top:10px"><a href="analysis.html" style="display:inline-block;background:rgba(91,140,255,.12);border:1px solid rgba(91,140,255,.35);color:#5b8cff;text-decoration:none;font-size:13px;font-weight:700;padding:9px 22px;border-radius:99px">🗂 مشاهده تاریخچه تحلیل‌ها</a></div>';
      ca+='</div>';
    }else{
      ca+='<div style="color:#8b949e;text-align:center;padding:12px;line-height:1.9">هنوز تحلیلی ثبت نشده است<br><span style="font-size:11px">عکس تحلیل را به ربات بفرستید.</span></div>';
    }
  }catch(e){
    ca+='<div style="color:#8b949e;text-align:center;padding:12px">هنوز تحلیلی ثبت نشده است</div>';
  }
  document.getElementById('ca').innerHTML=ca;

  // Timestamp
  var now=new Date();
  var th=now.toLocaleString('fa-IR',{timeZone:'Asia/Tehran'});
  var dataTime=d.timestamp||'unknown';
  document.getElementById('ts').textContent='\uD83D\uDFE2 \u0628\u0631\u0648\u0632\u0631\u0633\u0627\u0646\u06CC: '+th+' | \u062F\u0627\u062F\u0647: '+dataTime;
}

load();
setInterval(load,30000);
</script>
</body>
</html>
