name: Dollar Price Checker

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: dollar-price-checker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore whale history
        uses: actions/cache@v4
        with:
          path: whale-history.json
          key: whale-history-${{ github.run_id }}
          restore-keys: |
            whale-history-

      - name: Install dependencies
        run: pip install requests

      - name: Run price checker (attempt 1)
        id: attempt1
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_OFFSET_FILE: /tmp/telegram-command-offset.txt
          WHALE_STATE_FILE: whale-history.json
        run: python dollar-checker-cloud.py

      - name: Push prices.json to GitHub Pages
        if: always()
        run: |
          if [ -f prices.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # Push to main
            git add prices.json
            git commit -m "Update prices.json [skip ci]" || true
            git push origin main
            # Push to gh-pages for GitHub Pages
            cp prices.json /tmp/prices.json
            git fetch origin gh-pages
            git checkout gh-pages
            cp /tmp/prices.json prices.json
            git add prices.json
            git commit -m "Update prices.json [skip ci]" || true
            git push origin gh-pages
            git checkout main
          fi

      - name: Run price checker (retry if failed)
        if: steps.attempt1.outcome == 'failure'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_OFFSET_FILE: /tmp/telegram-command-offset.txt
          WHALE_STATE_FILE: whale-history.json
        run: python dollar-checker-cloud.py

      - name: Push prices.json to GitHub Pages (retry)
        if: always()
        run: |
          if [ -f prices.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add prices.json
            git commit -m "Update prices.json [skip ci]" || true
            git push origin main
            cp prices.json /tmp/prices.json
            git fetch origin gh-pages
            git checkout gh-pages
            cp /tmp/prices.json prices.json
            git add prices.json
            git commit -m "Update prices.json [skip ci]" || true
            git push origin gh-pages
            git checkout main
          fi
