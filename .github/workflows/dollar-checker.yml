name: Dollar Price Checker

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore whale history
        uses: actions/cache@v4
        with:
          path: whale-history.json
          key: whale-history-${{ github.run_id }}
          restore-keys: |
            whale-history-

      - name: Install dependencies
        run: pip install requests

      - name: Run price checker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_OFFSET_FILE: /tmp/telegram-command-offset.txt
          WHALE_STATE_FILE: whale-history.json
        run: python dollar-checker-cloud.py
